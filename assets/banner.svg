<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Siddharth Ganesan, Full Stack Developer moving into AI Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.88" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.05" cy="1" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glowViolet)"/>
  <rect width="1200" height="280" fill="url(#glowCyan)"/>
  <rect width="1200" height="280" fill="url(#dots)"/>

  <!-- quiet node-graph motif -->
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.45">
    <line x1="900" y1="150" x2="980" y2="90"/>
    <line x1="980" y1="90" x2="1070" y2="130"/>
    <line x1="980" y1="90" x2="1040" y2="40"/>
    <line x1="900" y1="150" x2="990" y2="205"/>
    <line x1="1070" y1="130" x2="1110" y2="200"/>
    <line x1="990" y1="205" x2="1110" y2="200"/>
  </g>
  <g fill="#0f172a" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.85">
    <circle cx="900" cy="150" r="7"/>
    <circle cx="980" cy="90" r="9"/>
    <circle cx="1070" cy="130" r="7"/>
    <circle cx="1040" cy="40" r="5"/>
    <circle cx="990" cy="205" r="6"/>
    <circle cx="1110" cy="200" r="5"/>
  </g>

  <rect x="80" y="52" width="48" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="90" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="#67e8f9">FULL STACK DEVELOPER  ·  AI ENGINEERING</text>
  <text x="80" y="155" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#f8fafc">Siddharth Ganesan</text>
  <text x="80" y="200" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Production web applications, LLM systems and AI agents.</text>
  <text x="80" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Bengaluru, India  ·  Open to AI / LLM engineering roles</text>
</svg>
